<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jeff's Email Assistant</title>
    
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .header h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #64748b;
            font-size: 14px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #1e293b;
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .sign-off-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        
        .sign-off-btn {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .sign-off-btn:hover {
            border-color: #cbd5e1;
        }
        
        .sign-off-btn.active {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        
        .sign-off-btn .label {
            font-weight: 600;
            color: #1e293b;
            display: block;
            margin-bottom: 4px;
        }
        
        .sign-off-btn .desc {
            font-size: 12px;
            color: #64748b;
        }
        
        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #64748b;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
        }
        
        .result.active {
            display: block;
        }
        
        .result-content {
            background: #f8fafc;
            border-radius: 8px;
            padding: 16px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #1e293b;
            margin-bottom: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .action-btn {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .action-btn.primary {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
        
        .action-btn:hover {
            transform: translateY(-1px);
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }
        
        .error.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ Jeff's Email Assistant</h1>
            <p>Business Attorney • Client-Friendly Responses</p>
        </div>
        
        <div class="card">
            <h2>📝 Your Response Points</h2>
            <textarea id="responsePoints" placeholder="Jot down the key points you want to address...

Example:
- Explain the liquidation preference
- Show example with numbers
- Mention this is standard for Series A
- Suggest we review together"></textarea>
        </div>
        
        <div class="card">
            <h2>✍️ Email Sign-off</h2>
            <div class="sign-off-options">
                <button class="sign-off-btn active" data-signoff="thanks">
                    <span class="label">Thanks, Jeff</span>
                    <span class="desc">Warm & friendly</span>
                </button>
                <button class="sign-off-btn" data-signoff="regards">
                    <span class="label">Regards, Jeff</span>
                    <span class="desc">Professional</span>
                </button>
            </div>
        </div>
        
        <button class="generate-btn" id="generateBtn">Generate Email</button>
        
        <div class="error" id="error"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Drafting your email...</p>
        </div>
        
        <div class="result" id="result">
            <div class="card">
                <h2>✉️ Draft Email</h2>
                <div class="result-content" id="resultContent"></div>
                <div class="action-buttons">
                    <button class="action-btn primary" id="insertBtn">Insert into Email</button>
                    <button class="action-btn" id="copyBtn">Copy to Clipboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedSignOff = 'thanks';
        let generatedEmail = '';
        
        // IMPORTANT: Replace with your actual Anthropic API key
        const ANTHROPIC_API_KEY = 'YOUR_API_KEY_HERE';
        
        Office.onReady((info) => {
            if (info.host === Office.HostType.Outlook) {
                setupEventListeners();
            }
        });
        
        function setupEventListeners() {
            // Sign-off buttons
            document.querySelectorAll('.sign-off-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.sign-off-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedSignOff = this.dataset.signoff;
                });
            });
            
            // Generate button
            document.getElementById('generateBtn').addEventListener('click', generateEmail);
            
            // Insert button
            document.getElementById('insertBtn').addEventListener('click', insertIntoEmail);
            
            // Copy button
            document.getElementById('copyBtn').addEventListener('click', copyToClipboard);
        }
        
        async function generateEmail() {
            const responsePoints = document.getElementById('responsePoints').value.trim();
            
            if (!responsePoints) {
                showError('Please enter your response points');
                return;
            }
            
            if (ANTHROPIC_API_KEY === 'YOUR_API_KEY_HERE') {
                showError('Please configure your Anthropic API key in the code');
                return;
            }
            
            hideError();
            showLoading();
            hideResult();
            
            try {
                // Get the email thread context
                const emailThread = await getEmailThread();
                
                const threadContext = emailThread 
                    ? `\n\nEmail thread I'm responding to:\n"${emailThread}"\n\n`
                    : '';
                
                const signOffText = selectedSignOff === 'thanks' ? 'Thanks, Jeff' : 'Regards, Jeff';
                
                const prompt = `You are Jeff, a business attorney who works with startup companies and small businesses.

Your communication style:
- Professional but approachable and friendly
- Educational - help clients understand without complex legal jargon
- Use plain language that clients can easily understand
- Keep emails SHORT and concise - aim for brevity
- Use bullet points to make information scannable
- Warm and supportive tone that builds trust

${threadContext}My key points to address: "${responsePoints}"

Instructions:
- Write a complete but SHORT email response (3-5 paragraphs maximum)
- Use bullet points where appropriate to organize information
- NEVER use asterisks (*) for emphasis or formatting
- Use **bold text** sparingly for section headings only (don't overuse headings - only when truly needed)
- Avoid complex legal terminology - explain things in plain English
- Be educational and help the client understand
- Keep it professional but friendly
- Make it concise and brief - clients are busy
- End with: ${signOffText}
- Do not include a subject line

Respond with ONLY the email body content. Do not include any explanations or additional text outside of the email.`;

                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': ANTHROPIC_API_KEY,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: prompt
                        }]
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                generatedEmail = data.content
                    .filter(item => item.type === 'text')
                    .map(item => item.text)
                    .join('\n')
                    .trim();
                
                displayResult(generatedEmail);
                hideLoading();
                showResult();
                
            } catch (error) {
                console.error('Error:', error);
                hideLoading();
                showError('Failed to generate email. Please check your API key and try again.');
            }
        }
        
        async function getEmailThread() {
            return new Promise((resolve) => {
                Office.context.mailbox.item.body.getAsync(
                    Office.CoercionType.Text,
                    (result) => {
                        if (result.status === Office.AsyncResultStatus.Succeeded) {
                            resolve(result.value);
                        } else {
                            resolve('');
                        }
                    }
                );
            });
        }
        
        function insertIntoEmail() {
            Office.context.mailbox.item.body.setAsync(
                generatedEmail,
                { coercionType: Office.CoercionType.Text },
                (result) => {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        alert('Email inserted successfully!');
                    } else {
                        showError('Failed to insert email. Please copy manually.');
                    }
                }
            );
        }
        
        function copyToClipboard() {
            navigator.clipboard.writeText(generatedEmail).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(() => {
                showError('Failed to copy. Please select and copy manually.');
            });
        }
        
        function displayResult(content) {
            document.getElementById('resultContent').textContent = content;
        }
        
        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        
        function showResult() {
            document.getElementById('result').classList.add('active');
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('active');
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }
        
        function hideError() {
            document.getElementById('error').classList.remove('active');
        }
    </script>
</body>
</html>
